<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <nav>
        <a>Appname</a>
        <ul>
          <li>
            <a class="menu-item">Add New Task </a>
          </li>
          <li><a class="menu-item">Teams </a></li>
          <li><a class="menu-item">Members</a></li>
        </ul>
      </nav>
      <section>
        <div class="flex-row space-between">
          <h1>Teams</h1>
          <a class="btn" href="">New Team</a>
        </div>
        <input
          class="input-text"
          type="search"
          placeholder="Search teams"
          aria-label="Search teams"
        />
        <div class="table">
          <h3 class="border-top-left">Team Name</h3>
          <h3>Members</h3>
          <h3>Tasks Completed</h3>
          <h3 class="border-top-right">Actions</h3>
          <div class="separator"></div>

          <div class="table-cell">
            <span>Team Alpha</span>
          </div>

          <div class="table-cell">
            <span>5</span>
          </div>

          <div class="table-cell">
            <div class="indicator-container">
              <div class="indicatior-value"></div>
            </div>
            <span>75</span>
          </div>

          <div class="table-cell">
            <a href="#">Edit</a>
          </div>

          <div class="separator"> 
          </div>

          <div class="table-cell">
            <span>Team Alpha</span>
          </div>

          <div class="table-cell">
            <span>5</span>
          </div>

          <div class="table-cell">
            <div class="indicator-container">
              <div class="indicatior-value indicator-25"></div>
            </div>
            <span>25</span>
          </div>
          <div class="table-cell">
            <a href="#">Edit</a>
          </div>


          
        </div>
      </section>
    </main>
  </body>
</html>
