<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
    <form id="order-form">
      <div>
        <label for="name-input">Name</label>
        <input type="text" id="name-input" />
      </div>
      <div>
        <label for="order-input">Order</label>
        <input type="text" id="order-input" />
      </div>
      <button type="submit">Create order</button>
    </form>

    <section>
      <div>
        <span>Total orders: <span id="total-orders">0</span></span>
        <span>Active orders: <span id="active-orders">0</span></span>
        <span>Served orders: <span id="served-orders">0</span></span>
      </div>
    </section>

    <section>
      <h2>Orders</h2>
      <ul id="orders-list">

      </ul>
    </section>


    </main>
    <script src="./app.js"></script>
  </body>
</html>
