# Continuous Integration: runs on every push / PR to catch issues before merge.
# If this folder is the Git repository root on GitHub, workflows here run as usual.
# If the repo root is a parent folder (monorepo), copy this file to <repo>/.github/workflows/
# and set defaults.run.working-directory to Lesson46/nextjs-wrapup-demo.

name: Unit tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test
